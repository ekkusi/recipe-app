on:
  push:
    branches: 
      - main
    paths:
      - apps/mobile/**
      - libs/shared/**
      

defaults:
  run:
    working-directory: ./apps/mobile

jobs:
  build_android:
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
