on:
  push:
    branches: 
      - main
    paths:
      - .eas/workflows/submit_android.yml
      - apps/mobile/**
      - libs/shared/**

jobs:
  build_android:
    defaults:
      run:
        working-directory: ./apps/mobile
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    defaults:
      run:
        working-directory: ./apps/mobile
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
